<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haryana College Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">Haryana Colleges</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="colleges.html">Colleges</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="compare.html">Compare</a></li>
                <li><a href="admission.html">Admission Guide</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <h2>Find Your Perfect College in Haryana</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search colleges, courses...">
                <button onclick="searchColleges()">Search</button>
            </div>
        </div>
    </section>

    <section class="filters">
        <div class="container">
            <h3>Filter by Category</h3>
            <div class="category-buttons">
                <button onclick="filterByCategory('all')">All</button>
                <button onclick="filterByCategory('engineering')">Engineering</button>
                <button onclick="filterByCategory('management')">Management</button>
                <button onclick="filterByCategory('polytechnic')">Polytechnic</button>
                <button onclick="filterByCategory('arts')">Arts & Science</button>
            </div>
            <div class="budget-filter">
                <label>Budget: <span id="budgetValue">50000</span></label>
                <input type="range" id="budgetRange" min="10000" max="200000" value="50000" step="10000" oninput="updateBudget(this.value)">
            </div>
        </div>
    </section>

    <section class="featured">
        <div class="container">
            <h3>Featured Colleges</h3>
            <div id="collegeGrid" class="college-grid"></div>
        </div>
    </section>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
